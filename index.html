<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FX AI Tool</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
padding:18px;
min-height:100vh;
font-family:Arial,"Yu Gothic",sans-serif;
background:linear-gradient(135deg,#08111f,#172944);
color:#fff;
}

.container{
max-width:780px;
margin:auto;
}

.card{
background:#182a44;
padding:24px;
border-radius:22px;
border:1px solid rgba(255,255,255,.12);
box-shadow:0 18px 50px rgba(0,0,0,.35);
}

h1{
text-align:center;
font-size:34px;
margin:0 0 18px;
}

.description{
background:#4e6787;
padding:15px;
border-radius:14px;
font-weight:bold;
line-height:1.6;
}

label{
display:block;
margin-top:16px;
margin-bottom:8px;
font-weight:bold;
}

input,
select{
width:100%;
padding:14px;
border-radius:12px;
border:1px solid #7f90a6;
background:#0d1c30;
color:white;
font-size:17px;
}

.input-grid,
.result-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

button{
width:100%;
padding:16px;
margin-top:18px;
border:0;
border-radius:12px;
font-size:19px;
font-weight:bold;
cursor:pointer;
color:white;
background:linear-gradient(90deg,#0fc5d8,#24e2df);
}

.secondary{
background:#415a77;
}

.danger{
background:#8b3d4b;
}

.result{
display:none;
margin-top:22px;
padding:18px;
border-radius:16px;
background:#0d1c30;
}

.signal{
font-size:30px;
font-weight:bold;
text-align:center;
margin-bottom:16px;
}

.buy{
color:#49e79c;
}

.sell{
color:#ff6d8e;
}

.wait{
color:#ffd166;
}

.score{
background:#1d3557;
padding:14px;
border-radius:12px;
margin-bottom:16px;
}

.bar{
height:12px;
background:#09131f;
border-radius:30px;
overflow:hidden;
margin-top:8px;
}

.fill{
height:100%;
width:0%;
background:linear-gradient(90deg,#18cfe3,#52f1a8);
}

.item{
background:#1d3557;
padding:14px;
border-radius:12px;
}

.item span{
display:block;
font-size:13px;
color:#b8c6d3;
margin-bottom:5px;
}

.item strong{
font-size:20px;
}

.judge{
margin-top:15px;
padding:14px;
border-radius:12px;
text-align:center;
font-weight:bold;
}

.ok{
background:rgba(20,180,110,.2);
border:1px solid #4be89e;
}

.ng{
background:rgba(255,193,7,.12);
border:1px solid #ffd166;
}

.history{
margin-top:26px;
border-top:1px solid rgba(255,255,255,.15);
padding-top:18px;
}

.history-row{
display:grid;
grid-template-columns:1.6fr 1fr 1fr;
gap:8px;
padding:10px 0;
border-bottom:1px solid rgba(255,255,255,.08);
font-size:13px;
}

.note{
margin-top:18px;
font-size:12px;
color:#cdd6df;
line-height:1.6;
}

@media(max-width:600px){

.input-grid,
.result-grid,
.history-row{

grid-template-columns:1fr;

}

}
</style>
</head>

<body>

<div class="container">
<div class="card">

<h1>📈 FX AI Tool</h1>

<div class="description">
相場の流れ・勢い・時間足・経済指標リスクを入力すると、
参考勝率・エントリー・利確・損切りを表示します。
</div>

<label for="pair">通貨ペア</label>

<select id="pair">
<option>AUD/JPY</option>
<option>NZD/JPY</option>
<option>CAD/JPY</option>
<option>USD/JPY</option>
<option>EUR/JPY</option>
</select>

<label for="price">現在価格</label>

<input
id="price"
type="number"
step="0.001"
placeholder="例：102.350"
>

<div class="input-grid">

<div>
<label for="trend">現在の流れ</label>

<select id="trend">
<option value="up">上昇傾向</option>
<option value="down">下降傾向</option>
<option value="range">レンジ</option>
</select>
</div>

<div>
<label for="strength">勢い</label>

<select id="strength">
<option value="strong">強い</option>
<option value="normal" selected>普通</option>
<option value="weak">弱い</option>
</select>
</div>

<div>
<label for="timeframe">時間足</label>

<select id="timeframe">
<option value="5">5分足</option>
<option value="15" selected>15分足</option>
<option value="60">1時間足</option>
<option value="240">4時間足</option>
</select>
</div>

<div>
<label for="risk">経済指標リスク</label>

<select id="risk">
<option value="low">低い</option>
<option value="medium" selected>普通</option>
<option value="high">高い</option>
</select>
</div>

</div>

<label for="chartImage">チャート画像</label>

<input
id="chartImage"
type="file"
accept="image/png,image/jpeg,image/webp"
onchange="previewChart()"
>

<img
id="chartPreview"
alt="チャート画像"
style="
display:none;
width:100%;
max-height:450px;
object-fit:contain;
margin-top:14px;
padding:8px;
border-radius:12px;
background:#09131f;
"
>

<div
id="chartStatus"
style="
margin-top:8px;
font-size:13px;
color:#cdd6df;
"
>
画像が選択されていません。
</div>

<button type="button" onclick="analyze()">
AI分析する
</button>

<button
type="button"
class="secondary"
onclick="saveTrade()"
>
分析結果を保存
</button>

<button
type="button"
class="danger"
onclick="clearHistory()"
>
保存履歴を削除
</button>

<div id="result" class="result">

<div id="signal" class="signal"></div>

<div class="score">

<strong>
総合スコア：
<span id="scoreText">0</span>点
</strong>

<div class="bar">
<div id="scoreFill" class="fill"></div>
</div>

</div>

<div class="result-grid">

<div class="item">
<span>参考勝率</span>
<strong id="winRate">-</strong>
</div>

<div class="item">
<span>通貨ペア</span>
<strong id="resultPair">-</strong>
</div>

<div class="item">
<span>エントリー目安</span>
<strong id="entry">-</strong>
</div>

<div class="item">
<span>利確目安</span>
<strong id="takeProfit">-</strong>
</div>

<div class="item">
<span>損切り目安</span>  
<strong id="stopLoss">-</strong>
</div>

<div class="item">
  <span>買い待ち価格</span>
  <strong id="buyTrigger">-</strong>
</div>

<div class="item">
  <span>売り待ち価格</span>
  <strong id="sellTrigger">-</strong>
</div>

<div class="item">
  <span>発動条件</span>
  <strong id="triggerReason">-</strong>
</div>  
<div class="item">
<span>リスク・リワード</span>
<strong id="riskReward">-</strong>
</div>

</div>

<div id="judgement" class="judge"></div>

<div class="history">

<h3>保存履歴</h3>

<div id="historyList"></div>

</div>

</div>

<div class="note">
※現在の画像機能はプレビュー表示までです。
画像内容を本物のAIが解析する機能は、APIキーを安全に管理する仕組みを追加してから接続します。
</div>

</div>
</div>

<script>

let lastAnalysis = null;

function previewChart(){

const input =
document.getElementById("chartImage");

const preview =
document.getElementById("chartPreview");

const status =
document.getElementById("chartStatus");

const file = input.files[0];

if(!file){

preview.style.display = "none";

preview.removeAttribute("src");

status.textContent =
"画像が選択されていません。";

return;

}

if(!file.type.startsWith("image/")){

alert("画像ファイルを選択してください。");

input.value = "";

return;

}

if(file.size > 10 * 1024 * 1024){

alert("画像は10MB以下にしてください。");

input.value = "";

return;

}

preview.src = URL.createObjectURL(file);

preview.style.display = "block";

status.textContent =
"チャート画像を読み込みました。";

}

async function analyze(){

 const pair =
  document.getElementById("pair").value || "不明";

const priceInput =
  document.getElementById("price").value;

const price =
  priceInput
    ? Number.parseFloat(priceInput)
    : "不明";

const timeframe =
  document.getElementById("timeframe").value || "不明";

  const risk =
    document.getElementById("risk").value;

  const file =
    document.getElementById("chartImage").files[0];

  if(!file){
    alert("チャート画像を選択してください。");
    return;
  }

  const button =
    document.querySelector(
      'button[onclick="analyze()"]'
    );

  button.disabled = true;
  button.textContent = "AI分析中...";

  try{

    const image = await new Promise(
      function(resolve,reject){

        const reader = new FileReader();

        reader.onload = function(){
          resolve(reader.result);
        };

        reader.onerror = function(){
          reject(
            new Error(
              "画像を読み込めませんでした。"
            )
          );
        };

        reader.readAsDataURL(file);

      }
    );

    const response = await fetch(
      "/.netlify/functions/analyze-chart",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          image: image,
          pair: pair,
          price: Number.isFinite(price) ? price.toFixed(3) : "不明",
          timeframe: timeframe
        })
      }
    );

    const data = await response.json();

    if(!response.ok){
      console.error(data);

      throw new Error(
        data.error ||
        "AI分析に失敗しました。"
      );
    }

    const analysis = data.analysis;

    const score =
      Number(analysis.score) || 0;

    const direction =
      analysis.direction || "見送り";

    const signal =
      document.getElementById("signal");

    if(direction === "買い"){

      signal.textContent =
        "▲ 買い優勢";

      signal.className =
        "signal buy";

    }else if(direction === "売り"){

      signal.textContent =
        "▼ 売り優勢";

      signal.className =
        "signal sell";

    }else{

      signal.textContent =
        "⏸ 見送り";

      signal.className =
        "signal wait";

    }

    document
      .getElementById("scoreText")
      .textContent = String(score);

    document
      .getElementById("scoreFill")
      .style.width =
      Math.max(
        0,
        Math.min(100,score)
      ) + "%";

    document
      .getElementById("winRate")
      .textContent =
      score + "%";

    document
      .getElementById("resultPair")
      .textContent =
      analysis.pair || pair || "不明";
     
    if (analysis.pair && analysis.pair !== "不明") {
      document.getElementById("pair").value = analysis.pair;
    }

    if (analysis.price && analysis.price !== "不明") {
      document.getElementById("price").value = analysis.price;
    }

    if (analysis.timeframe && analysis.timeframe !== "不明") {
      document.getElementById("timeframe").value = analysis.timeframe;
    }

    document
      .getElementById("entry")
      .textContent =
      analysis.entry || "判断困難";

    document
      .getElementById("takeProfit")
      .textContent =
      analysis.takeProfit ||
      "判断困難";

    document
      .getElementById("stopLoss")
      .textContent =
      analysis.stopLoss ||
      "判断困難";
document
  .getElementById("buyTrigger")
  .textContent =
  analysis.buyTrigger || "-";

document
  .getElementById("sellTrigger")
  .textContent =
  analysis.sellTrigger || "-";

document
  .getElementById("triggerReason")
  .textContent =
  analysis.triggerReason || "-";    

const entryNum = Number.parseFloat(analysis.entry);
const takeProfitNum = Number.parseFloat(analysis.takeProfit);
const stopLossNum = Number.parseFloat(analysis.stopLoss);

const reward = Math.abs(takeProfitNum - entryNum);
const riskAmount = Math.abs(entryNum - stopLossNum);

const rr =
  Number.isFinite(reward) &&
  Number.isFinite(riskAmount) &&
  riskAmount > 0
    ? (reward / riskAmount).toFixed(2)
    : "-";

document
  .getElementById("riskReward")
  .textContent =
  rr === "-" ? "-" : `1 : ${rr}`;

    const judgement =
      document.getElementById(
        "judgement"
      );

    if(
      score >= 80 &&
      direction !== "見送り" &&
      risk !== "high" && 
      rr !== "-" &&
      Number.parseFloat(rr) >= 1.0
    ){

      judgement.className =
        "judge ok";

      judgement.textContent =
        "🚀 GO！AIスコア80以上：" +
        direction +
        "エントリー候補です。";

    }else{

      judgement.className =
        "judge ng";

      judgement.textContent =
        "⚠️ AIスコア80未満、見送り判定、または指標リスクあり：見送り推奨です。";

    }

    lastAnalysis = {

      date:
        new Date().toLocaleString(
          "ja-JP"
        ),

      pair: pair,

      price:
        price.toFixed(3),

      rate:
        score + "%",

      direction:
        direction

    };

    document
      .getElementById("result")
      .style.display =
      "block";

    loadHistory();

  }catch(error){

    console.error(error);

    alert(
      "AI分析でエラーが発生しました。\n" +
      error.message
    );

  }finally{

    button.disabled = false;
    button.textContent = "AI分析する";

  }

}
function saveTrade(){

if(!lastAnalysis){

alert("先にAI分析を実行してください。");

return;

}

const history =
JSON.parse(
localStorage.getItem("fxHistory") || "[]"
);

history.unshift(lastAnalysis);

localStorage.setItem(
"fxHistory",
JSON.stringify(
history.slice(0,20)
)
);

loadHistory();

alert("分析結果を保存しました。");

}

function loadHistory(){

const history =
JSON.parse(
localStorage.getItem("fxHistory") || "[]"
);

const box =
document.getElementById("historyList");

if(history.length === 0){

box.innerHTML =
"<p>保存履歴はありません。</p>";

return;

}

box.innerHTML =
history.map(function(item){

return `
<div class="history-row">

<div>${item.date}</div>

<div>
${item.pair}・${item.direction}
</div>

<div>${item.rate}</div>

</div>
`;

}).join("");

}

function clearHistory(){

if(
!confirm(
"保存履歴を削除しますか？"
)
){

return;

}

localStorage.removeItem("fxHistory");

loadHistory();

}

loadHistory();

</script>

</body>
</html>
