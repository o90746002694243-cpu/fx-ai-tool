<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FX AI Tool</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 min-height:100vh;
 padding:18px;
 color:#fff;
 font-family:Arial,"Yu Gothic",sans-serif;
 background:linear-gradient(135deg,#091221,#182943)
}
.container{max-width:760px;margin:auto}
.card{
 background:rgba(25,42,68,.97);
 border:1px solid rgba(255,255,255,.12);
 border-radius:22px;
 padding:24px;
 box-shadow:0 18px 45px rgba(0,0,0,.35)
}
h1{text-align:center;margin:0 0 18px;font-size:34px}
.info{
 background:#536984;
 border-radius:14px;
 padding:14px;
 line-height:1.6;
 font-weight:bold
}
label{display:block;margin:16px 0 7px;font-weight:bold}
select,input{
 width:100%;
 padding:14px;
 font-size:17px;
 color:#fff;
 background:#0d1b2e;
 border:1px solid #8091a8;
 border-radius:12px
}
button{
 width:100%;
 margin-top:20px;
 padding:16px;
 border:0;
 border-radius:13px;
 font-size:19px;
 font-weight:bold;
 color:#fff;
 cursor:pointer;
 background:linear-gradient(90deg,#13bfd3,#16dfdd)
}
button.secondary{
 margin-top:10px;
 background:#334a68
}
.result{
 display:none;
 margin-top:22px;
 padding:18px;
 background:#0d1b2e;
 border-radius:16px
}
.signal{
 text-align:center;
 font-size:29px;
 font-weight:bold;
 margin:10px 0 18px
}
.buy{color:#46e49d}
.sell{color:#ff7c8c}
.wait{color:#ffd166}
.grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:11px
}
.item{
 padding:13px;
 background:#1c2e49;
 border-radius:11px
}
.item span{
 display:block;
 color:#aebdce;
 font-size:13px;
 margin-bottom:5px
}
.item strong{font-size:20px}
.decision{
 margin-top:14px;
 padding:13px;
 border-radius:11px;
 text-align:center;
 font-weight:bold;
 line-height:1.5
}
.ok{
 background:rgba(38,190,120,.18);
 border:1px solid #39d18e
}
.ng{
 background:rgba(255,193,7,.14);
 border:1px solid #ffd166
}
.history{
 margin-top:22px;
 padding-top:18px;
 border-top:1px solid rgba(255,255,255,.15)
}
.history-row{
 display:grid;
 grid-template-columns:1fr 1fr 1fr;
 gap:8px;
 padding:9px 0;
 border-bottom:1px solid rgba(255,255,255,.1);
 font-size:14px
}
.note{
 margin-top:17px;
 color:#cbd5e1;
 font-size:12px;
 line-height:1.6
}
@media(max-width:520px){
 body{padding:10px}
 .card{padding:17px}
 h1{font-size:28px}
 .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="container">
<div class="card">

<h1>📈 FX AI Tool</h1>

<div class="info">
勝率80%以上と判断した時だけエントリー推奨します。
</div>

<label>通貨ペア</label>
<select id="pair">
<option>AUD/JPY</option>
<option>NZD/JPY</option>
<option>USD/JPY</option>
<option>CAD/JPY</option>
<option>EUR/JPY</option>
</select>

<label>現在価格</label>
<input id="price" type="number" step="0.001" placeholder="例 98.250">

<label>AI判定</label>
<select id="trend">
<option value="buy">買い優勢</option>
<option value="sell">売り優勢</option>
<option value="wait">様子見</option>
</select>

<button onclick="analyze()">AI分析する</button>
<button class="secondary" onclick="saveTrade()">結果を保存</button>

<div class="result" id="result">

<div id="signal" class="signal"></div>

<div class="grid">

<div class="item">
<span>勝率</span>
<strong id="rate"></strong>
</div>

<div class="item">
<span>エントリー</span>
<strong id="entry"></strong>
</div>

<div class="item">
<span>利確</span>
<strong id="tp"></strong>
</div>

<div class="item">
<span>損切り</span>
<strong id="sl"></strong>
</div>

</div>

<div id="judge" class="decision"></div>

<div class="history">
<h3>保存履歴</h3>
<div id="history"></div>
</div>

</div>

<div class="note">
※AI補助ツールです。最終判断はご自身で行ってください。
</div>

</div>
</div>

<script>

function analyze(){

const price=parseFloat(document.getElementById("price").value);

if(!price){
alert("価格を入力してください");
return;
}

const trend=document.getElementById("trend").value;

let rate=0;
let signal="";
if(trend==="buy"){
rate=84;
signal="▲ 買い優勢";
}else if(trend==="sell"){
rate=84;
signal="▼ 売り優勢";
}else{
rate=62;
signal="⏸ 様子見";
}

const entry=price;
const tp=trend==="buy"
?price+0.150
:trend==="sell"
?price-0.150
:price;

const sl=trend==="buy"
?price-0.100
:trend==="sell"
?price+0.100
:price;

const signalEl=document.getElementById("signal");

signalEl.textContent=signal;
signalEl.className=
"signal "+
(trend==="buy"
?"buy"
:trend==="sell"
?"sell"
:"wait");

document.getElementById("rate").textContent=rate+"%";
document.getElementById("entry").textContent=
trend==="wait"?"-":entry.toFixed(3);
document.getElementById("tp").textContent=
trend==="wait"?"-":tp.toFixed(3);
document.getElementById("sl").textContent=
trend==="wait"?"-":sl.toFixed(3);

const judge=document.getElementById("judge");

if(rate>=80 && trend!=="wait"){
judge.className="decision ok";
judge.textContent=
"✅ 勝率80%以上：エントリー候補";
}else{
judge.className="decision ng";
judge.textContent=
"⚠️ 条件未達：見送り推奨";
}

document.getElementById("result").style.display="block";
loadHistory();
}

function saveTrade(){

const pair=document.getElementById("pair").value;
const price=document.getElementById("price").value;
const trend=document.getElementById("trend").value;

if(!price){
alert("先に価格を入力してください");
return;
}

const item={
date:new Date().toLocaleString("ja-JP"),
pair:pair,
price:price,
trend:trend
};

const data=JSON.parse(
localStorage.getItem("fxHistory")||"[]"
);

data.unshift(item);

localStorage.setItem(
"fxHistory",
JSON.stringify(data.slice(0,10))
);

loadHistory();

alert("履歴を保存しました");
}

function loadHistory(){

const box=document.getElementById("history");

const data=JSON.parse(
localStorage.getItem("fxHistory")||"[]"
);

if(data.length===0){
box.innerHTML="<p>保存履歴はありません。</p>";
return;
}

box.innerHTML=data.map(function(item){

const label=
item.trend==="buy"
?"買い"
:item.trend==="sell"
?"売り"
:"様子見";

return `
<div class="history-row">
<div>${item.date}</div>
<div>${item.pair}</div>
<div>${label} ${item.price}</div>
</div>
`;

}).join("");
}

loadHistory();

</script>
</body>
</html>
