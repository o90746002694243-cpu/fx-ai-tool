<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FX AI Tool</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  padding:18px;
  color:#ffffff;
  font-family:Arial,"Yu Gothic",sans-serif;
  background:
  linear-gradient(135deg,#08111f,#172944);
}

.container{
  width:100%;
  max-width:780px;
  margin:0 auto;
}

.card{
  padding:24px;
  border-radius:22px;
  background:rgba(24,42
<body>
<div class="container">
  <div class="card">

    <h1>📈 FX AI Tool</h1>

    <div class="description">
      相場の流れ・勢い・時間足・経済指標リスクを入力し、
      試作ロジックで売買方向・参考勝率・エントリー・利確・損切りを表示します。
    </div>

    <h2 class="section-title">分析条件</h2>

    <label for="pair">通貨ペア</label>
    <select id="pair">
      <option>AUD/JPY</option>
      <option>NZD/JPY</option>
      <option>CAD/JPY</option>
      <option>USD/JPY</option>
      <option>EUR/JPY</option>
    </select>

    <label for="price">現在価格</label>
    <input
      id="price"
      type="number"
      step="0.001"
      placeholder="例：102.350"
    >

    <div class="input-grid">

      <div>
        <label for="trend">現在の流れ</label>
        <select id="trend">
          <option value="up">上昇傾向</option>
          <option value="down">下降傾向</option>
          <option value="range">レンジ</option>
        </select>
      </div>

      <div>
        <label for="strength">勢い</label>
        <select id="strength">
          <option value="strong">強い</option>
          <option value="normal" selected>普通</option>
          <option value="weak">弱い</option>
        </select>
      </div>

      <div>
        <label for="timeframe">時間足</label>
        <select id="timeframe">
          <option value="5">5分足</option>
          <option value="15" selected>15分足</option>
          <option value="60">1時間足</option>
          <option value="240">4時間足</option>
        </select>
      </div>

      <div>
        <label for="indicatorRisk">経済指標リスク</label>
        <select id="indicatorRisk">
          <option value="low">低い</option>
          <option value="medium" selected>普通</option>
          <option value="high">高い</option>
        </select>
      </div>

    </div>

    <button onclick="analyze()">AI分析する</button>
    <button class="secondary" onclick="saveTrade()">分析結果を保存</button>
    <button class="danger" onclick="clearHistory()">保存履歴を削除</button>

    <div id="result" class="result">

      <div id="signal" class="signal"></div>

      <div class="score-box">
        <strong>総合スコア：<span id="scoreText">0</span>点</strong>
        <div class="score-bar">
          <div id="scoreFill" class="score-fill"></div>
        </div>
      </div>

      <div class="result-grid">

        <div class="result-item">
          <span>参考勝率</span>
          <strong id="winRate">-</strong>
        </div>

        <div class="result-item">
          <span>通貨ペア</span>
          <strong id="resultPair">-</strong>
        </div>

        <div class="result-item">
          <span>エントリー目安</span>
          <strong id="entry">-</strong>
        </div>

        <div class="result-item">
          <span>利確目安</span>
          <strong id="takeProfit">-</strong>
        </div>

        <div class="result-item">
          <span>損切り目安</span>
          <strong id="stopLoss">-</strong>
        </div>

        <div class="result-item">
          <span>リスク・リワード</span>
          <strong id="riskReward">-</strong>
        </div>

      </div>

      <div id="judgement" class="judgement"></div>

      <div class="history">
        <h3>保存履歴</h3>
        <div id="historyList"></div>
      </div>

    </div>

    <div class="note">
      ※これは動作確認用の試作版です。実際のチャート、経済指標、
      ニュース、リアルタイム価格を自動取得しているわけではありません。
      表示結果だけで取引を行わないでください。
    </div>

  </div>
</div>

<script>
function analyze(){

const pair=document.getElementById("pair").value;
const price=parseFloat(document.getElementById("price").value);
const trend=document.getElementById("trend").value;
const strength=document.getElementById("strength").value;
const timeframe=document.getElementById("timeframe").value;
const indicator=document.getElementById("indicatorRisk").value;

if(!price){
alert("現在価格を入力してください");
return;
}

let score=50;

if(trend==="up") score+=15;
if(trend==="down") score+=15;
if(trend==="range") score-=5;

if(strength==="strong") score+=20;
if(strength==="normal") score+=10;
if(strength==="weak") score-=10;

if(timeframe==="15") score+=5;
if(timeframe==="60") score+=8;
if(timeframe==="240") score+=10;

if(indicator==="medium") score-=5;
if(indicator==="high") score-=15;

if(score>95) score=95;
if(score<40) score=40;

let signal="様子見";
let cls="wait";

if(trend==="up"){
signal="▲ 買い優勢";
cls="buy";
}

if(trend==="down"){
signal="▼ 売り優勢";
cls="sell";
}

document.getElementById("signal").textContent=signal;
document.getElementById("signal").className="signal "+cls;

document.getElementById("scoreText").textContent=score;
document.getElementById("scoreFill").style.width=score+"%";

document.getElementById("winRate").textContent=score+"%";
document.getElementById("resultPair").textContent=pair;

const pip=0.01;

let entry=price;
let tp=price;
let sl=price;

if(trend==="up"){
entry=price+0.02;
tp=entry+0.18;
sl=entry-0.12;
}

if(trend==="down"){
entry=price-0.02;
tp=entry-0.18;
sl=entry+0.12;
}

document.getElementById("entry").textContent=entry.toFixed(3);
document.getElementById("takeProfit").textContent=tp.toFixed(3);
document.getElementById("stopLoss").textContent=sl.toFixed(3);
document.getElementById("riskReward").textContent="1 : 1.5";

const judge=document.getElementById("judgement");

if(score>=80){
judge.className="judgement judgement-ok";
judge.innerHTML="✅ AI判定：勝率80%以上。エントリー候補です。";
}else{
judge.className="judgement judgement-wait";
judge.innerHTML="⚠ AI判定：条件不足。見送り推奨。";
}

document.getElementById("result").style.display="block";

loadHistory();

}
function saveTrade(){

const pair=document.getElementById("pair").value;
const price=document.getElementById("price").value;
const rate=document.getElementById("winRate").textContent;

if(price===""){
alert("先に分析してください");
return;
}

const history=JSON.parse(localStorage.getItem("fxHistory")||"[]");

history.unshift({
date:new Date().toLocaleString("ja-JP"),
pair:pair,
price:price,
rate:rate
});

localStorage.setItem(
"fxHistory",
JSON.stringify(history.slice(0,20))
);

loadHistory();

alert("保存しました");

}

function loadHistory(){

const history=JSON.parse(localStorage.getItem("fxHistory")||"[]");

const box=document.getElementById("historyList");

if(history.length===0){
box.innerHTML="<p>保存履歴はありません。</p>";
return;
}

box.innerHTML=history.map(item=>`
<div class="history-row">
<div>${item.date}</div>
<div>${item.pair}</div>
<div>${item.rate}</div>
</div>
`).join("");

}

function clearHistory(){

if(!confirm("保存履歴を削除しますか？")){
return;
}

localStorage.removeItem("fxHistory");

loadHistory();

}

loadHistory();

</script>

</body>
</html>
